name: Docs redirects

# The MTConnect.NET documentation is published in the MTConnect.NET Docs on
# www.trakhound.com (built from the TrakHound.Site repository). GitHub Pages
# (https://trakhound.github.io/MTConnect.NET/) now only serves redirect pages
# from every route of the old documentation site to its new location; see
# docs/redirects/build.mjs.
#
# Triggers:
# - push to master that changes the redirects: build and deploy.
# - pull_request to master that changes the redirects: build only.
# - workflow_dispatch: build and deploy.
#
# Action versions are pinned to commit SHAs (tag aliases appear in trailing
# comments) so a tag rewrite cannot silently change what runs.
on:
  push:
    branches: [ master ]
    paths:
      - 'docs/redirects/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'docs/redirects/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least-privilege defaults. The deploy job overrides this with the
# `pages: write` + `id-token: write` permissions GitHub Pages requires.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build redirect pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Node.js is preinstalled on the runner; the script needs no packages.
      - name: Build redirect pages
        run: node docs/redirects/build.mjs docs/redirects/_site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/redirects/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    # Only one deploy can run at a time. In-progress deploys are not
    # canceled so that a started Pages publish gets to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
