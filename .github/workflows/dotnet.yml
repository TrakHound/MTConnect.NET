name: build-test-coverage

# Restrict the GITHUB_TOKEN to read-only contents access. The jobs only
# need to checkout the repo, run dotnet build / test, and upload TRX +
# coverage artifacts; no commit / release / package-write privileges are
# required. Defense-in-depth against supply-chain attacks via a
# compromised dependency or a test-side RCE.
permissions:
  contents: read

# One run per PR / branch: a new push to a PR cancels the superseded run
# instead of letting both occupy runners for the full duration. Pushes
# to master are never cancelled, so every merge commit gets a complete
# run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  # ------------------------------------------------------------------
  # Job 0 — dotnet format gate. Verifies the tree matches the default
  # `dotnet format` ruleset with zero diff, so formatting drift
  # (indentation, brace placement, whitespace) is caught at PR time
  # instead of silently accumulating into the baseline every
  # subsequent branch then has to inherit. The repo does not yet ship
  # a root `.editorconfig`, so the enforced ruleset is whatever the
  # SDK pinned by `actions/setup-dotnet` treats as its whitespace /
  # C# formatting defaults; introducing a committed `.editorconfig`
  # that freezes those rules against future SDK drift is tracked as a
  # follow-up (see PR description). Uses the default "warn" severity
  # — the same severity `dotnet format` applies with no --severity
  # flag — rather than --severity info: at info severity dotnet format
  # additionally tries to auto-fix long-standing Roslyn analyzer
  # diagnostics (CA1859, CA1861, CA1018, ...) across the repo, which
  # is a materially different (and, on this SDK/analyzer combination,
  # occasionally crash-prone) undertaking from verifying whitespace /
  # style formatting and is out of scope for this gate. `--verbosity
  # diagnostic` is set on the verify step so the CI log names each
  # offending file and rule when the gate fires — a contributor can
  # then reproduce and fix locally without scrolling for the delta.
  # A second verify step covers the two csprojs that ship with the
  # `dotnet new` template but are not members of `MTConnect.NET.sln`;
  # the template itself is a public-surface artifact for downstream
  # consumers, so it belongs under the same gate as the main tree.
  # Runs on the same draft-skip gate as the other jobs and does not
  # depend on them, so a formatting-only fix gets fast feedback.
  # ------------------------------------------------------------------
  format:
    name: format
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup .NET 8.0 + 9.0
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore solution
        run: dotnet restore MTConnect.NET.sln

      - name: Verify solution format (dotnet format --verify-no-changes)
        run: dotnet format MTConnect.NET.sln --verify-no-changes --no-restore --verbosity diagnostic

      # `MTConnect.NET.sln` does not include the two csprojs that ship
      # with the `dotnet new mtconnect.net-agent` template (the
      # template descriptor + the generated project's csproj under
      # `content/`). They are public-surface artifacts for downstream
      # template consumers, so formatting drift there is exactly what
      # the gate is meant to catch. Restore + verify them explicitly
      # rather than adding them to the solution (which would compile
      # them on every unrelated build and complicate the template
      # packaging step). Each project gets its own restore + verify
      # step so a failure names the specific template in the Actions
      # step-summary panel rather than in the collapsed log.
      - name: Restore template descriptor
        run: dotnet restore templates/mtconnect.net-agent/MTConnect-NET-Agent-Template.csproj

      - name: Restore template content project
        run: dotnet restore templates/mtconnect.net-agent/content/MTConnect.NET-Embedded-Agent/Agent.csproj

      - name: Verify template descriptor format
        run: dotnet format templates/mtconnect.net-agent/MTConnect-NET-Agent-Template.csproj --verify-no-changes --no-restore --verbosity diagnostic

      - name: Verify template content project format
        run: dotnet format templates/mtconnect.net-agent/content/MTConnect.NET-Embedded-Agent/Agent.csproj --verify-no-changes --no-restore --verbosity diagnostic

  # ------------------------------------------------------------------
  # Job 1 — unsharded unit + integration sweep on both OS legs.
  # Excludes Category=E2E altogether; the route walk is handled in
  # job 3 below. windows-latest additionally excludes
  # Category=RequiresDocker (hosted Windows runners do NOT pre-install
  # Docker for Linux containers — only Windows containers via Hyper-V).
  # XsdLoadStrict has no platform dependency and still runs on both
  # legs. This job carries no Node / docfx / npm overhead: every step
  # it runs is a pure .NET workload, so the docs-build wall-clock is
  # paid exactly once across the whole workflow (in job 2 below).
  # ------------------------------------------------------------------
  build-and-test:
    name: build-and-test
    # Skip drafts: run only on push-to-master + ready (non-draft) PRs.
    # The pull_request `types` list above includes `ready_for_review`
    # so CI fires the moment a draft is flipped to ready.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Coverage is collected on ubuntu-latest only. Both legs execute
        # the same managed code, so a second Cobertura set from Windows
        # adds no information while paying the full instrumentation
        # cost again; the Windows leg's job is to catch platform
        # differences (paths, sockets, line endings), which plain test
        # execution covers.
        include:
          # ubuntu-latest runs every non-E2E category: Docker is pre-
          # installed on GitHub-hosted Linux runners and Testcontainers
          # can spawn the eclipse-mosquitto + mtconnect/agent images
          # the RequiresDocker suites need; the XSD source-of-truth
          # files ship in-repo, so XsdLoadStrict also has every
          # prerequisite. The shared filter excludes E2E only.
          - os: ubuntu-latest
            testFilter: "Category!=E2E"
            coverage: true
          # windows-latest GitHub-hosted runners do NOT pre-install
          # Docker for Linux containers (only Windows containers via
          # Hyper-V), so the RequiresDocker suites that boot Linux
          # images (eclipse-mosquitto:2.0.22, mtconnect/agent:latest)
          # cannot run there. E2E is already excluded for every leg of
          # this job. XsdLoadStrict has no platform dependency and
          # still runs.
          - os: windows-latest
            testFilter: "Category!=RequiresDocker&Category!=E2E"
            coverage: false

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup .NET 8.0 + 9.0
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dotnet tools (ReportGenerator)
        if: matrix.coverage
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore MTConnect.NET.sln

      - name: Build (Debug)
        run: dotnet build MTConnect.NET.sln --configuration Debug --no-restore

      # MTConnect.NET-Integration-Tests is skipped here (its
      # IsTestProject is false unless IntegrationCoverage=true) and run
      # in the dedicated step below so it can use its own
      # tests/coverlet.integration.runsettings. VSTest precedence is
      # CLI --settings > RunSettingsFilePath, so a per-project settings
      # file cannot win against this solution-wide --settings; running
      # the project as its own step is the only way to give it
      # different coverage scoping. See the integration .csproj
      # comment.
      # Each test project writes its own TRX: the logger uses
      # LogFilePrefix rather than LogFileName, because a fixed
      # LogFileName is shared by every project in a solution-wide run
      # and each project overwrote the previous one's results.
      - name: Run unit tests
        env:
          TEST_FILTER: ${{ matrix.testFilter }}
          COVERAGE: ${{ matrix.coverage }}
        run: |
          settings=()
          if [ "$COVERAGE" = "true" ]; then
            settings=(--settings tests/coverlet.runsettings)
          fi
          dotnet test MTConnect.NET.sln \
            --configuration Debug \
            --no-build \
            "${settings[@]}" \
            --results-directory TestResults/unit \
            --logger "trx;LogFilePrefix=unit" \
            --filter "$TEST_FILTER"
        shell: bash

      # Zero-test false-green guard, per project. A broken adapter
      # wiring or an over-eager filter that discovers nothing must
      # hard-fail rather than exit 0.
      - name: Guard — unit step executed > 0 tests
        run: bash tools/ci/check-trx.sh "Unit" "TestResults/unit/*.trx"
        shell: bash

      # Integration suite with its own coverlet settings: the shared
      # configuration plus MTConnect.NET-Common and MTConnect.NET-HTTP
      # excluded from instrumentation, and MaxCpuCount=1 (this step is
      # serial; the shared file no longer pins it). Common+HTTP are
      # the dominant-cost assemblies on the timing-critical in-process
      # Agent/HTTP hot path this suite drives; coverlet IL
      # instrumentation of them on a slow shared runner pushes sample
      # delivery past the test's wait. Both are covered (faster) by
      # MTConnect.NET-Common-Tests / MTConnect.NET-HTTP-Tests. The
      # latter (with its AgentRunner support project
      # MTConnect.NET-Tests-Agents) is a member of MTConnect.NET.sln,
      # so the "Run unit tests" step above already
      # discovers and runs it under the shared runsettings; it starts
      # a real MTConnectAgentBroker + MTConnectHttpServer and streams
      # Probe/Current/Sample through the HTTP clients, exercising the
      # Common + HTTP runtime path. Its Cobertura ReportGenerator
      # merges with this one, so excluding Common+HTTP here loses no
      # net coverage. MTConnect.NET-SHDR stays instrumented (the
      # integration suite is its only runtime coverage).
      #
      # The integration .csproj sets IsTestProject=false unless
      # IntegrationCoverage=true, so the solution build above compiled
      # it as a non-test assembly. This step therefore rebuilds the
      # project WITH -p:IntegrationCoverage=true (so xunit's VSTest
      # adapter is wired in and tests are discoverable) and only then
      # runs it with --no-build. Without the explicit build the
      # solution-built non-test assembly would discover 0 tests and
      # the step would false-green.
      - name: Build integration project with IntegrationCoverage flag
        run: |
          dotnet build tests/MTConnect.NET-Integration-Tests/MTConnect.NET-Integration-Tests.csproj \
            --configuration Debug \
            --no-restore \
            -p:IntegrationCoverage=true
        shell: bash

      - name: Run integration tests
        env:
          TEST_FILTER: ${{ matrix.testFilter }}
          COVERAGE: ${{ matrix.coverage }}
        run: |
          settings=()
          if [ "$COVERAGE" = "true" ]; then
            settings=(--settings tests/coverlet.integration.runsettings)
          fi
          dotnet test tests/MTConnect.NET-Integration-Tests/MTConnect.NET-Integration-Tests.csproj \
            --configuration Debug \
            --no-build \
            -p:IntegrationCoverage=true \
            "${settings[@]}" \
            --results-directory TestResults/integration \
            --logger "trx;LogFilePrefix=integration" \
            --filter "$TEST_FILTER"
        shell: bash

      # Hard-fail the job if the integration step discovered/executed
      # 0 tests. A future regression that re-breaks test discovery
      # (e.g. the IntegrationCoverage build wiring) would otherwise
      # false-green: dotnet test exits 0 when it finds nothing to run.
      # Parse the TRX <Counters .../> total and fail when it is 0 or
      # the element is missing.
      - name: Guard — integration step executed > 0 tests
        run: bash tools/ci/check-trx.sh "Integration" "TestResults/integration/*.trx"
        shell: bash

      - name: Generate coverage HTML + summary
        if: always() && matrix.coverage
        run: |
          dotnet reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;TextSummary;MarkdownSummary"
        shell: bash

      - name: Upload TRX + coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
            coverage-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Surface coverage summary in job log
        if: always() && matrix.coverage
        env:
          JOB_LABEL: ${{ matrix.os }}
        run: |
          if [ -f coverage-report/Summary.txt ]; then
            echo "### Coverage summary (${JOB_LABEL})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report/Summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

  # ------------------------------------------------------------------
  # Job 2 — docs preparation. Runs once. Produces docs/.vitepress/dist
  # by invoking `npm ci && npm run build`, which transitively triggers
  # the `prebuild` hook (`npm run regen` → `bash scripts/generate-api-
  # ref.sh` → `docfx metadata`). The built dist tree is uploaded as a
  # workflow artifact so the sharded route-check job below can skip
  # the npm + docfx + build wall-clock (~5 min) entirely. The test
  # fixture's [OneTimeSetUp] checks for docs/.vitepress/dist/index.html
  # and skips the `npm ci && npm run build` bootstrap when the file is
  # present, so a shard that downloads the artifact into the right
  # path bypasses the bootstrap altogether.
  # ------------------------------------------------------------------
  docs-prepare:
    name: docs-prepare
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup .NET 8.0 + 9.0
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # `npm run build` in docs/ invokes the `prebuild` hook (`npm run
      # regen`), which calls `bash scripts/generate-api-ref.sh` →
      # `docfx metadata` to produce the /api/ reference tree the
      # VitePress site consumes.
      - name: Install docfx
        run: dotnet tool install -g docfx
        shell: bash

      - name: npm ci
        working-directory: docs
        run: npm ci

      - name: npm run build
        working-directory: docs
        run: npm run build

      - name: Upload docs dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: docs-dist
          path: docs/.vitepress/dist/
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # Job 3 — sharded Category=E2E route walk. Four parallel ubuntu
  # shards each carry a disjoint subset of the markdown-backed routes
  # via ROUTE_SHARD_INDEX / ROUTE_SHARD_TOTAL env vars (consumed by
  # RouteCheckHelpers.ReadShardEnv + ShardRoutes). The docs-dist
  # artifact from job 2 is downloaded into docs/.vitepress/dist/ so
  # the test fixture's [OneTimeSetUp] skips the npm bootstrap (it
  # detects the pre-existing index.html). npm ci still runs to
  # populate docs/node_modules/ so `npx vitepress preview` finds the
  # local vitepress binary; that step is fast on the npm cache hit
  # primed by `actions/setup-node`. docfx is NOT installed here — the
  # prebuild hook only fires from `npm run build`, which this job
  # skips. Each shard runs only `Category=E2E`, so the non-E2E
  # categories run exactly once (in job 1) across the workflow.
  # ------------------------------------------------------------------
  route-check-e2e:
    name: route-check-e2e
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    needs: docs-prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup .NET 8.0 + 9.0
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Only the Docs-Tests project (and its project references) is
      # needed to run the route walk; building the whole solution in
      # each of the four shards was pure overhead.
      - name: Build Docs-Tests (Debug)
        run: dotnet build tests/MTConnect.NET-Docs-Tests/MTConnect.NET-Docs-Tests.csproj --configuration Debug

      # Populate docs/node_modules/ so `npx vitepress preview` resolves
      # the local vitepress binary the test fixture spawns. The npm
      # cache primed by actions/setup-node above makes this fast on
      # warm runners; first-pull-after-bump pays the full cost once
      # per shard. Skipping `npm run build` is the actual win — that's
      # the ~5 min docfx + vitepress build that job 2 paid once.
      - name: npm ci
        working-directory: docs
        run: npm ci

      - name: Download docs dist artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: docs/.vitepress/dist/

      # Cache Playwright browser binaries so the Category=E2E
      # [OneTimeSetUp] `playwright install chromium` call is a no-op
      # on cache hit. The key hashes the `playwright-core`
      # package.json that the Microsoft.Playwright NuGet copies into
      # the build output — that file's `version` field directly pins
      # the chromium revision the .NET binding drives. Hashing the
      # csproj instead would only invalidate by coincidence (a future
      # PR adding an unrelated PackageReference would invalidate; an
      # SDK-side change to the chromium revision would not). The step
      # therefore runs AFTER `dotnet build` so the file exists —
      # placement before build would force the key off a workspace-
      # internal artefact (hashFiles cannot reach the NuGet cache
      # under ~/.nuget), so the micro-optimisation of overlapping
      # cache restore with build is sacrificed for key correctness.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/tests/MTConnect.NET-Docs-Tests/bin/Debug/net8.0/.playwright/package/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Run E2E route-check shard
        env:
          # ROUTE_SHARD_INDEX / ROUTE_SHARD_TOTAL drive
          # RouteCheckTests via RouteCheckHelpers.ReadShardEnv ->
          # ShardRoutes, splitting the ~1,880-route Playwright walk
          # across N parallel matrix entries. Integers come from the
          # static strategy.matrix definition above, never from
          # github.event.* untrusted input.
          ROUTE_SHARD_INDEX: ${{ matrix.shard }}
          ROUTE_SHARD_TOTAL: ${{ matrix.shardTotal }}
        # No coverage here: the shards exercise the docs site, not
        # library code, and their Cobertura was never merged into the
        # coverage report (only build-and-test runs ReportGenerator).
        run: |
          dotnet test tests/MTConnect.NET-Docs-Tests/MTConnect.NET-Docs-Tests.csproj \
            --configuration Debug \
            --no-build \
            --results-directory TestResults/e2e \
            --logger "trx;LogFilePrefix=e2e-shard${ROUTE_SHARD_INDEX}of${ROUTE_SHARD_TOTAL}" \
            --filter "Category=E2E"
        shell: bash

      - name: Guard — E2E shard executed > 0 tests
        run: bash tools/ci/check-trx.sh "E2E" "TestResults/e2e/*.trx"
        shell: bash

      - name: Upload E2E TRX artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results-e2e-shard${{ matrix.shard }}of${{ matrix.shardTotal }}
          path: |
            TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------
  # Job 4 — Release-pack matrix gate. The build-and-test job above only
  # exercises Debug, which compiles each csproj against a single TFM
  # (net8.0 — see the per-project `<PropertyGroup Condition="…Debug">`
  # blocks). Release / Package configurations multi-target net4x →
  # net9.0; some diagnostics only fire on the legacy TFMs (CS0162 from
  # `#if NET5_0_OR_GREATER` branches that go unreachable on net4x), and
  # some only on net9.0 (SYSLIB0057 X509Certificate2 ctor obsoletion).
  # The May-22 regression slipped through CI precisely because Debug
  # never built net4x; this job runs `dotnet pack -c Package` across
  # the full TFM matrix to catch the next regression class at PR time.
  #
  # Package is the configuration releases are packed with, so this also
  # checks the published package set: only projects that opt in with
  # <IsPackable>true</IsPackable> are packed (see Directory.Build.props),
  # and the job fails when the number of packages changes. Update
  # EXPECTED_PACKAGES when a package is deliberately added or removed.
  #
  # Single-process (no shard), no docs dependency, same draft-skip
  # gate as build-and-test. The pack output is written to a workflow-
  # local `dist/` directory and discarded — the produced .nupkg files
  # are not uploaded as artefacts; the gate's only output is the exit
  # code.
  # ------------------------------------------------------------------
  release-pack:
    name: release-pack
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup .NET 8.0 + 9.0
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore solution
        run: dotnet restore MTConnect.NET.sln

      - name: Pack -c Package across multi-TFM
        run: |
          rm -rf dist
          mkdir -p dist
          dotnet pack MTConnect.NET.sln -c Package \
            -p:VersionSuffix=ci-check \
            -p:ContinuousIntegrationBuild=true \
            -o dist 2>&1 | tee pack.log
        shell: bash

      - name: Check the published package set
        env:
          EXPECTED_PACKAGES: 27
        run: |
          actual=$(find dist -maxdepth 1 -name '*.nupkg' | wc -l)
          if [ "$actual" -ne "$EXPECTED_PACKAGES" ]; then
            echo "::error::Packed $actual packages, expected $EXPECTED_PACKAGES. Set <IsPackable>true</IsPackable> on a new package (or false on a project that shouldn't be published) and update EXPECTED_PACKAGES."
            find dist -maxdepth 1 -name '*.nupkg' -printf '%f\n' | sort
            exit 1
          fi
          echo "Packed $actual packages"
        shell: bash

      # Surface a compact summary of every error / warning that
      # tripped the pack. The `dotnet pack` step above pipes into
      # `tee pack.log`; the unmasked exit propagates via the
      # pipeline's PIPESTATUS through `set -o pipefail`, which is
      # the GitHub-default for bash steps. This step only runs on
      # failure, by design — when the pack is green, the produced
      # nupkgs are not inspected further.
      #
      # The regex matches any MSBuild-shaped diagnostic —
      # `error XX0000` / `warning XX0000` where XX is one or more
      # letters (CS, CA, NU, SYSLIB, MSB, NETSDK, IL, XA, StyleCop,
      # Roslyn analyzers, and mixed-case analyzer families like
      # `xUnit1004` / `nunit1001` that ship lowercase prefixes).
      # The prior `(CS|CA|NU|SYSLIB|MSB)` enumeration silently
      # dropped every family outside that set and produced empty
      # summaries when the pack failed on any of them. The
      # broadened pattern is a strict superset so no failure
      # family is masked. `[A-Za-z]+[0-9]+` keeps the "letters
      # then digits" shape so bare `warning:` prose lines and
      # counter lines like `2 Warning(s)` are not matched.
      #
      # The `head -100` cap is a paste-into-summary safety valve;
      # when it triggers, a `showing 100 of N` breadcrumb makes
      # the truncation explicit so a maintainer triaging a
      # summary-visible slice knows the full failure set is
      # larger than what is rendered.
      - name: Surface pack errors (if any)
        if: failure()
        run: |
          diag_pattern='\b(error|warning)[[:space:]]+[A-Za-z]+[0-9]+'
          diag_total=$(grep -cE "$diag_pattern" pack.log 2>/dev/null || echo 0)
          diag_unique=$(grep -E "$diag_pattern" pack.log 2>/dev/null | sort -u | wc -l)
          echo "### Release-pack diagnostics" >> "$GITHUB_STEP_SUMMARY"
          if [ "$diag_unique" -gt 100 ]; then
            echo "_Showing first 100 of ${diag_unique} unique diagnostics (${diag_total} total matching lines)._" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$diag_unique" -gt 0 ]; then
            echo "_${diag_unique} unique diagnostics (${diag_total} total matching lines)._" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "$diag_pattern" pack.log \
            | sort -u | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        shell: bash
